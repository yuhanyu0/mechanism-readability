<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560">
<rect width="1200" height="560" fill="white"/>
<style>.t{font-family:Arial,Helvetica,sans-serif;fill:#111}.h{font-size:28px;font-weight:700}.s{font-size:17px}.m{font-size:15px}.axis{stroke:#111;stroke-width:1.5}.grid{stroke:#ddd;stroke-width:1}.bar{fill:#bdbdbd}.official{fill:white;stroke:#111;stroke-width:3}</style>
<text x="60" y="48" class="t h">Held-out model comparison</text>
<text x="60" y="78" class="t s">R² on a frozen held-out object split from the same upstream dataset · higher is better</text>
<line x1="320.0" y1="110" x2="320.0" y2="490" class="grid"/>
<text x="320.0" y="515" text-anchor="middle" class="t m">-0.02</text>
<line x1="400.0" y1="110" x2="400.0" y2="490" class="grid"/>
<text x="400.0" y="515" text-anchor="middle" class="t m">0.00</text>
<line x1="600.0" y1="110" x2="600.0" y2="490" class="grid"/>
<text x="600.0" y="515" text-anchor="middle" class="t m">0.05</text>
<line x1="800.0" y1="110" x2="800.0" y2="490" class="grid"/>
<text x="800.0" y="515" text-anchor="middle" class="t m">0.10</text>
<line x1="1000.0" y1="110" x2="1000.0" y2="490" class="grid"/>
<text x="1000.0" y="515" text-anchor="middle" class="t m">0.15</text>
<line x1="400.0" y1="110" x2="400.0" y2="490" class="axis"/>
<text x="300" y="150" text-anchor="end" class="t m">Weighted free exponent</text>
<rect x="400.0" y="130" width="618.6" height="28" class="bar"/>
<text x="1028.6" y="150" text-anchor="start" class="t m">0.155</text>
<text x="300" y="200" text-anchor="end" class="t m">Developmental hinge</text>
<rect x="400.0" y="180" width="613.9" height="28" class="bar"/>
<text x="1023.9" y="200" text-anchor="start" class="t m">0.153</text>
<text x="300" y="250" text-anchor="end" class="t m">Linear log-rho</text>
<rect x="400.0" y="230" width="608.3" height="28" class="bar"/>
<text x="1018.3" y="250" text-anchor="start" class="t m">0.152</text>
<text x="300" y="300" text-anchor="end" class="t m">Weighted p=1</text>
<rect x="400.0" y="280" width="506.6" height="28" class="bar"/>
<text x="916.6" y="300" text-anchor="start" class="t m">0.127</text>
<text x="300" y="350" text-anchor="end" class="t m">Canonical surface</text>
<rect x="400.0" y="330" width="405.0" height="28" class="official"/>
<text x="815.0" y="350" text-anchor="start" class="t m">0.101</text>
<text x="300" y="400" text-anchor="end" class="t m">Weighted p=2</text>
<rect x="400.0" y="380" width="310.0" height="28" class="bar"/>
<text x="720.0" y="400" text-anchor="start" class="t m">0.078</text>
<text x="300" y="450" text-anchor="end" class="t m">Constant null</text>
<rect x="358.2" y="430" width="41.8" height="28" class="bar"/>
<text x="348.2" y="450" text-anchor="end" class="t m">-0.010</text>
<text x="60" y="545" class="t m">Canonical surface remains informative, but it is not the best tested low-capacity predictor. This is not independent external-dataset replication.</text>
</svg>
